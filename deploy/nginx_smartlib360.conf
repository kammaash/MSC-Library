# Nginx reverse proxy for library.msceducation.net -> SmartLib360
# (Waitress, listening on 127.0.0.1:5000 per LIBRARY_BIND_HOST in the
# systemd service file.)
#
# INSTALL (before running certbot):
#   sudo cp nginx_smartlib360.conf /etc/nginx/sites-available/smartlib360
#   sudo ln -s /etc/nginx/sites-available/smartlib360 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get the certificate (this rewrites the file to add the SSL
# server block automatically):
#   sudo certbot --nginx -d library.msceducation.net

server {
    listen 80;
    server_name library.msceducation.net;

    # Large digital-library uploads (PDFs, audio, video) need a higher
    # limit than Nginx's 1MB default — matches app.py's MAX_CONTENT_LENGTH
    # (1 GB; videos up to 400 MB).
    client_max_body_size 1024M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file transfers (digital library uploads/downloads) can
        # run long on a school's connection — keep the proxy from timing
        # out early. Matches the channel_timeout Waitress is already
        # configured with in app.py.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
