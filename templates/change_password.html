<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ product_name }} — Change Your Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page" data-csrf="{{ csrf_token }}">

<div class="login-card" id="changePwCard">
  <div class="crest-row">
    <img src="{{ url_for('static', filename='images/logo_main.png') }}" alt="">
    <img src="{{ url_for('static', filename='images/logo_smartlib360.png') }}" alt="">
  </div>
  <h1>Please Change Your Password</h1>
  <p class="sub-login">This account was created or reset with a temporary password</p>
  <p class="tagline">For security, please choose your own password before continuing.</p>

  <form id="changePwForm">
    <label>Current (Temporary) Password
      <input type="password" id="currentPassword" autocomplete="current-password">
    </label>
    <label>New Password
      <input type="password" id="newPassword" autocomplete="new-password">
    </label>
    <label>Confirm New Password
      <input type="password" id="confirmNewPassword" autocomplete="new-password">
    </label>
    <p class="login-hint" style="margin-top:0;">
      At least 8 characters, with both letters and numbers.
    </p>
    <p class="login-error" id="changePwError"></p>
    <button type="submit" class="brass">Set New Password &amp; Continue</button>
  </form>
  <button type="button" class="ghost back-to-welcome-btn" id="logoutBtn">Sign out instead</button>
</div>

<script>
document.getElementById('changePwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('changePwError');
  errorEl.textContent = '';

  const payload = {
    current_password: document.getElementById('currentPassword').value,
    new_password: document.getElementById('newPassword').value,
    confirm_password: document.getElementById('confirmNewPassword').value,
  };

  try {
    const res = await fetch('/api/account/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': document.body.dataset.csrf || '' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || 'Could not change password.'; return; }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = 'Could not reach the server. Please try again.';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await fetch('/logout', { method: 'POST', headers: { 'X-CSRF-Token': document.body.dataset.csrf || '' } }); } catch (err) {}
  window.location.href = '/login';
});
</script>
</body>
</html>
